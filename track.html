<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track your order — ELMS</title>
<meta name="description" content="Check the delivery status of your order." />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://elmstool.com/track" />
<meta name="theme-color" content="#0064D2" />
<link rel="icon" href="/favicon.ico?v=2" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B1220; --ink2: #334155; --mute: #64748B; --line: #E4E9F2; --bg: #FFFFFF; --soft: #F5F8FE;
    --red: #E53238; --blue: #0064D2; --yellow: #F5AF02; --green: #86B817; --navy: #0A1530;
    --shadow: 0 18px 50px rgba(15, 35, 80, .12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--soft); color: var(--ink); font: 16px/1.6 Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { color: var(--blue); text-decoration: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }

  .nav { padding: 22px 0; }
  .nav .wrap { display: flex; justify-content: center; }
  .logo img { display: block; height: 28px; width: auto; }

  main { padding: 20px 0 60px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 30px 26px; box-shadow: var(--shadow); }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
  .sub { color: var(--mute); font-size: 14.5px; margin: 0 0 22px; }

  .lookup { display: flex; gap: 8px; }
  .lookup input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .lookup input:focus { outline: none; border-color: var(--blue); }
  .lookup button { border: none; background: var(--blue); color: #fff; font: inherit; font-weight: 700; padding: 0 20px; border-radius: 12px; cursor: pointer; }
  .lookup button:disabled { opacity: .6; cursor: default; }

  .result { margin-top: 24px; }
  .status-row { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; background: var(--soft); }
  .status-dot { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: #fff; border: 1.5px solid var(--line); }
  .status-title { font-weight: 800; font-size: 16px; }
  .status-detail { color: var(--mute); font-size: 13.5px; margin-top: 2px; }
  .status-row.delivered .status-dot { background: rgba(134,184,23,.15); border-color: transparent; color: var(--green); }
  .status-row.transit .status-dot { background: rgba(0,100,210,.12); border-color: transparent; color: var(--blue); }
  .status-row.exception .status-dot { background: rgba(229,50,56,.12); border-color: transparent; color: var(--red); }
  .status-row.pending .status-dot { background: rgba(245,175,2,.15); border-color: transparent; color: var(--yellow); }

  .msg { text-align: center; padding: 30px 10px; color: var(--mute); font-size: 14.5px; }
  .msg.error { color: var(--red); }
  .skel { height: 72px; border-radius: 14px; background: linear-gradient(100deg, #EEF2F9 30%, #F8FAFE 50%, #EEF2F9 70%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  footer { text-align: center; padding: 0 20px 30px; color: var(--mute); font-size: 12.5px; }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>
<body>
<div class="nav"><div class="wrap"><a class="logo" href="/" aria-label="ELMS home"><img src="/logo-wordmark.png" alt="ELMS" width="107" height="28"></a></div></div>

<main>
  <div class="wrap">
    <div class="card">
      <h1>Track your order</h1>
      <p class="sub">Enter the tracking code from your order to see its delivery status.</p>
      <form class="lookup" id="lookupForm">
        <input id="codeInput" type="text" placeholder="e.g. ELM12345" autocomplete="off" autocapitalize="characters" spellcheck="false" />
        <button type="submit" id="lookupBtn">Track</button>
      </form>
      <div class="result" id="result"></div>
    </div>
  </div>
</main>

<footer>&copy; <span id="yr"></span> ELMS</footer>

<script>
(function () {
  var API = 'https://elms-backend-1-tr5h.onrender.com';
  var $ = function (id) { return document.getElementById(id); };
  $('yr').textContent = new Date().getFullYear();

  // Generic, carrier/source-agnostic labels - the API itself never says which supplier or carrier this is.
  var LABELS = {
    Pending: ['pending', '⏳', 'On its way', 'We are waiting for the first update on this order.'],
    NotAvailable: ['pending', '⏳', 'Not available yet', 'This order has not shipped yet, or its tracking has not started.'],
    NotFound: ['pending', '⏳', 'Not available yet', 'No update yet. Please check back later.'],
    InfoReceived: ['pending', '📦', 'Preparing to ship', 'The order is being prepared for shipment.'],
    InTransit: ['transit', '🚚', 'On its way', 'Your order is in transit.'],
    Expired: ['exception', '⚠️', 'No recent update', 'There has been no tracking update for a while.'],
    AvailableForPickup: ['transit', '📍', 'Ready for pickup', 'Your order is available for pickup.'],
    OutForDelivery: ['transit', '🚚', 'Out for delivery', 'Your order is out for delivery today.'],
    DeliveryFailure: ['exception', '⚠️', 'Delivery attempt failed', 'A delivery attempt was made but did not succeed.'],
    Delivered: ['delivered', '✓', 'Delivered', 'Your order has been delivered.'],
    Exception: ['exception', '⚠️', 'Delivery exception', 'There is an issue with this shipment.'],
  };

  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function render(status, detail, at) {
    var info = LABELS[status] || LABELS.Pending;
    var when = at ? new Date(at).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
    $('result').innerHTML =
      '<div class="status-row ' + info[0] + '"><div class="status-dot">' + info[1] + '</div><div>' +
      '<div class="status-title">' + esc(info[2]) + '</div>' +
      '<div class="status-detail">' + esc(detail || info[3]) + (when ? ' &middot; ' + esc(when) : '') + '</div>' +
      '</div></div>';
  }

  function showMessage(text, isError) {
    $('result').innerHTML = '<div class="msg' + (isError ? ' error' : '') + '">' + esc(text) + '</div>';
  }

  function lookup(code) {
    code = String(code || '').trim().toUpperCase();
    if (!code) return;
    $('codeInput').value = code;
    $('lookupBtn').disabled = true;
    $('result').innerHTML = '<div class="skel"></div>';
    fetch(API + '/api/track/' + encodeURIComponent(code))
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d.success) { showMessage("We could not find that tracking code. Please check it and try again.", true); return; }
        render(res.d.status, res.d.statusDetail, res.d.statusAt);
        try { history.replaceState(null, '', '/track/' + code); } catch (e) { /* fine without it */ }
      })
      .catch(function () { showMessage('Could not connect right now. Please try again in a moment.', true); })
      .then(function () { $('lookupBtn').disabled = false; });
  }

  $('lookupForm').addEventListener('submit', function (e) { e.preventDefault(); lookup($('codeInput').value); });

  var fromPath = (location.pathname.match(/\/track\/([A-Za-z0-9]+)/) || [])[1];
  var fromQuery = new URLSearchParams(location.search).get('code');
  var initial = fromPath || fromQuery;
  if (initial) lookup(initial); else showMessage('Enter your tracking code above.');
})();
</script>
</body>
</html>
